name: Update story data
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: update-story-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official story releases
        id: data
        run: python scripts/update_story_data.py
      - name: Verify candidate data and online build
        if: steps.data.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          npm ci
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/check_release.py
          python scripts/bootstrap.py
          PYTHONPATH=scripts python -c "from data_updates import validate_projection; from data_store import read_json; from pathlib import Path; print(validate_projection(Path('reader/data'), read_json(Path('config/data-source.json'))['sha256']))"
          npm run build
          node scripts/check-online.mjs
      - name: Commit only validated data lock
        if: steps.data.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git diff --name-only)" = 'config/data-source.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/data-source.json
          git commit -m 'Update verified story data snapshot'
          gh auth setup-git
          git push origin HEAD:main
      - name: Deploy verified story data
        if: steps.data.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Explain failed update
        if: failure()
        run: |
          echo '剧情更新失败，请查看失败步骤。未验证的数据不会提交，部署失败时原网站继续服务；修复后可手动运行本工作流重试。' >> "$GITHUB_STEP_SUMMARY"
